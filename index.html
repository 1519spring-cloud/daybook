<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Daybook</title>
<style>
:root {
  --bg: #f7f4ee; --surface: #ffffff; --surface2: #efebe3; --text: #1d1f23; --muted: #6b6f78;
  --line: #e2ddd3; --accent: #1f4468; --accent-text: #ffffff; --gold: #c8923c; --danger: #b3261e;
  --hi: #fff1c2; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --serif: "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c; --surface: #1f2227; --surface2: #292d33; --text: #eceae6; --muted: #9a9ea6;
    --line: #33373e; --accent: #8fb6de; --accent-text: #10263b; --gold: #d9a553; --danger: #f2877e;
    --hi: #5a4a16; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
body { overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }

/* App frame */
#app { display: flex; flex-direction: column; height: 100%; }
header.top { padding: calc(var(--st) + 10px) 16px 8px; display: flex; align-items: center; gap: 10px; background: var(--bg); position: sticky; top: 0; z-index: 5; }
header.top h1 { font: 700 28px/1.1 var(--serif); margin: 0; flex: 1; letter-spacing: -.01em; }
.journal-pick { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); }
.journal-pick select { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 0; -webkit-appearance: none; appearance: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--accent); }
.iconbtn:active { background: var(--surface2); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--sb) + 96px); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: var(--sb); z-index: 10; }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--muted); }
nav.tabs button.on { color: var(--accent); }
.fab { position: fixed; right: 18px; bottom: calc(var(--sb) + 70px); width: 58px; height: 58px; border-radius: 29px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.22); z-index: 11; }
.fab svg.i { width: 28px; height: 28px; stroke-width: 2.2; }

/* Timeline */
.month { font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.entry { display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; align-items: flex-start; width: 100%; text-align: left; }
.entry .d { width: 40px; text-align: center; flex: none; }
.entry .d b { display: block; font: 600 22px/1 var(--serif); }
.entry .d small { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.entry .body { flex: 1; min-width: 0; }
.entry .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .snip { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
.entry .meta svg.i { width: 14px; height: 14px; }
.entry img.th { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; background: var(--surface2); }
.star { color: var(--gold); } svg.i.star { fill: currentColor; color: var(--gold); }
.otd { padding: 14px; margin: 8px 0 4px; border-left: 4px solid var(--gold); }
.otd h3 { margin: 0 0 6px; font: 600 15px var(--sans); }
.otd button { display: block; text-align: left; width: 100%; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.otd button:first-of-type { border-top: 0; }
.banner { padding: 12px 14px; margin: 8px 0; font-size: 14px; display: flex; gap: 10px; align-items: center; background: var(--hi); border-radius: 12px; }
.banner button { color: var(--accent); font-weight: 600; margin-left: auto; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty h2 { font: 600 22px var(--serif); color: var(--text); margin: 0 0 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 4px; }
.stats div { padding: 10px; text-align: center; }
.stats b { display: block; font: 600 20px var(--serif); }
.stats small { color: var(--muted); font-size: 12px; }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
.cal-head h2 { font: 600 20px var(--serif); margin: 0; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 4px; }
.cal button { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; position: relative; }
.cal button.has::after { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--gold); position: absolute; bottom: 5px; }
.cal button.today { color: var(--accent); font-weight: 700; }
.cal button.sel { background: var(--accent); color: var(--accent-text); }
.cal button.sel::after { background: var(--accent-text); }

/* Media grid */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 8px; }
.grid button { aspect-ratio: 1; overflow: hidden; background: var(--surface2); }
.grid img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Search */
.searchbox { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface2); border-radius: 12px; margin: 8px 0; }
.searchbox input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.chip { padding: 5px 11px; border-radius: 16px; background: var(--surface2); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
.chip.on { background: var(--accent); color: var(--accent-text); }
mark { background: var(--hi); color: inherit; border-radius: 3px; }

/* Sheets (full-screen overlays) */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet > header { padding: calc(var(--st) + 8px) 12px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.sheet > header .ttl { flex: 1; text-align: center; font-weight: 600; font-size: 15px; }
.sheet > header .ttl small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.txtbtn { color: var(--accent); font-weight: 600; padding: 8px 6px; min-width: 64px; }
.txtbtn.l { text-align: left; } .txtbtn.r { text-align: right; }
.sheet .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px calc(var(--sb) + 24px); }

/* Editor */
.ed-text { display: block; width: 100%; border: 0; outline: none; background: transparent; resize: none; font: 18px/1.55 var(--serif); padding: 4px 0; overflow: hidden; }
.ph-inl { position: relative; margin: 8px 0; }
.ph-inl img { width: 100%; max-height: 70vh; object-fit: cover; border-radius: 12px; display: block; background: var(--surface2); min-height: 80px; }
.ph-inl .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 16px; background: #000a; color: #fff; display: grid; place-items: center; font-size: 20px; }
.ed-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
.photos .ph { position: relative; flex: none; }
.photos img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; display: block; }
.photos .x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 12px; background: #000a; color: #fff; display: grid; place-items: center; font-size: 14px; }
.toolbar { display: flex; justify-content: space-around; padding: 8px 8px calc(var(--sb) + 8px); border-top: 1px solid var(--line); background: var(--surface); }
.toolbar button { padding: 8px; color: var(--accent); border-radius: 10px; position: relative; }
.toolbar button.on { color: var(--gold); }
.toolbar label { padding: 8px; color: var(--accent); display: grid; place-items: center; }
.pop { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; margin: 0 12px 8px; }
.pop h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.moods { display: flex; justify-content: space-between; }
.moods button { font-size: 30px; padding: 4px 8px; border-radius: 12px; opacity: .55; }
.moods button.on { opacity: 1; background: var(--surface2); }
.row { display: flex; gap: 8px; align-items: center; }
.row input[type=text], .row input[type=search], .field { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: none; min-width: 0; font-size: 16px; }
.btn { padding: 10px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.ghost { background: var(--surface2); color: var(--text); }
.btn.danger { background: transparent; color: var(--danger); }
.prompt-list button { display: block; width: 100%; text-align: left; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.prompt-list button:first-child { border-top: 0; }

/* Reader */
.reader .when { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.reader .md { font: 18px/1.6 var(--serif); overflow-wrap: anywhere; }
.reader .md h1, .reader .md h2, .reader .md h3 { font-family: var(--serif); line-height: 1.25; margin: 18px 0 8px; }
.reader .md h1 { font-size: 26px; } .reader .md h2 { font-size: 22px; } .reader .md h3 { font-size: 19px; }
.reader .md p { margin: 0 0 12px; }
.reader .md blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--gold); color: var(--muted); }
.reader .md a { color: var(--accent); }
.reader .md code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
.reader .md ul, .reader .md ol { padding-left: 22px; margin: 0 0 12px; }
.reader .pics { display: grid; gap: 8px; margin: 16px 0; }
.reader .pics img { width: 100%; border-radius: 12px; display: block; }
.reader .md img.inl { width: 100%; border-radius: 12px; display: block; margin: 4px 0 16px; background: var(--surface2); }
.reader .facts { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; font-size: 14px; color: var(--muted); margin-top: 16px; }
.reader .facts div { display: flex; gap: 8px; align-items: center; }
.reader .facts svg.i { width: 18px; height: 18px; }

/* Settings */
.group { margin: 18px 0 0; }
.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 6px 6px; font-weight: 600; }
.group .card > * { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; border-top: 1px solid var(--line); text-align: left; }
.group .card > *:first-child { border-top: 0; }
.group .card .sub { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.note { color: var(--muted); font-size: 13px; margin: 6px 8px 0; }

/* Lock */
#lock { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-bottom: var(--sb); }
#lock h2 { font: 600 22px var(--serif); margin: 0; }
.dots { display: flex; gap: 14px; height: 16px; }
.dots i { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--text); }
.dots i.f { background: var(--text); }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.keys button { width: 76px; height: 76px; border-radius: 38px; background: var(--surface2); font-size: 28px; }
.keys button:active { background: var(--line); }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

#toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 140px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 60; max-width: 86vw; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: grid; place-items: center; }
#viewer img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div style="flex:1">
      <h1 id="view-title">Journal</h1>
      <label class="journal-pick"><select id="journal-filter" aria-label="Journal"></select>
        <svg class="i" style="width:14px;height:14px"><use href="#i-down"/></svg></label>
    </div>
    <button class="iconbtn" id="btn-settings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>
  <main id="main"></main>
  <button class="fab" id="btn-new" aria-label="New entry"><svg class="i"><use href="#i-plus"/></svg></button>
  <nav class="tabs">
    <button data-view="timeline" class="on"><svg class="i"><use href="#i-list"/></svg>Journal</button>
    <button data-view="calendar"><svg class="i"><use href="#i-cal"/></svg>Calendar</button>
    <button data-view="media"><svg class="i"><use href="#i-photo"/></svg>Photos</button>
    <button data-view="search"><svg class="i"><use href="#i-search"/></svg>Search</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
</svg>
<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
